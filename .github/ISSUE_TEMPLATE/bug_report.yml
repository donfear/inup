name: Bug report
description: Something in inup isn't working as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a report. A clear repro is the fastest path to a fix.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did inup do instead?
      placeholder: I ran `inup` in a pnpm workspace and…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. In a repo with `…`
        2. Run `inup --apply --target latest`
        3. See error
    validations:
      required: true
  - type: dropdown
    id: package-manager
    attributes:
      label: Package manager
      options:
        - npm
        - yarn
        - pnpm
        - bun
        - other / not sure
    validations:
      required: true
  - type: input
    id: inup-version
    attributes:
      label: inup version
      description: Output of `inup --version`
      placeholder: 1.6.8
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v22.19.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug output (optional)
      description: If you can, re-run with `--debug` and paste the relevant lines. This is automatically formatted as code.
      render: shell

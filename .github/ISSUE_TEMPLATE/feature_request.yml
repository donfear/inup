name: Feature request
description: Something inup should do that it doesn't
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or situation where inup falls short — not yet the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like inup to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you've considered
      description: e.g. what you currently do instead, or how other tools handle it.

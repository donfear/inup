name: Update pnpm via Corepack

on:
  schedule:
    # Off the hour to reduce the chance of GitHub Actions schedule delays.
    - cron: '31 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# Scheduled and manually dispatched runs share one rolling PR branch. Never run
# both at once, otherwise each could attempt to update the same PR branch.
concurrency:
  group: corepack-pnpm-update
  cancel-in-progress: false

jobs:
  update:
    name: Update the pnpm pin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Enable Corepack after setup-node so its shims target the Node version
      # running this workflow.
      - name: Enable Corepack
        run: corepack enable

      - name: Update pnpm package-manager pin
        id: update
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail

          corepack use pnpm@latest

          # A new pnpm release can update lockfile metadata or format while
          # Corepack installs it. Allow that paired change, but reject any
          # dependency or source change outside these package-manager files.
          if ! git diff --quiet -- . ':(exclude)package.json' ':(exclude)pnpm-lock.yaml'; then
            echo '::error::Corepack changed files other than package.json or pnpm-lock.yaml.'
            git diff --name-only
            exit 1
          fi

          PACKAGE_MANAGER="$(node -p "require('./package.json').packageManager")"
          if ! [[ "$PACKAGE_MANAGER" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+\+sha512\.[a-f0-9]{128}$ ]]; then
            echo "::error::Corepack did not write a pinned pnpm version with a SHA-512 integrity hash: $PACKAGE_MANAGER"
            exit 1
          fi

          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'pnpm is already pinned to the latest release.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Updated package manager to $PACKAGE_MANAGER"
          fi

      - name: Create or update rolling pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT }}
          committer: ${{ secrets.GH_USERNAME }} <${{ secrets.GH_EMAIL }}>
          author: ${{ secrets.GH_USERNAME }} <${{ secrets.GH_EMAIL }}>
          branch: chore/corepack-pnpm-update
          base: main
          title: 'chore: update pnpm via Corepack'
          commit-message: 'chore: update pnpm via Corepack'
          body: |
            Updates the repository's Corepack-managed pnpm version to the latest release. The lockfile is included when the new pnpm version updates its metadata or format.

            _Generated by the Update pnpm via Corepack workflow._
          labels: |
            dependencies
            automated
          add-paths: |
            package.json
            pnpm-lock.yaml
          delete-branch: true

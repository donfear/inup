name: Release
run-name: Releasing ${{ inputs.version_type }}

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format and lint
        run: pnpm check:ci

      - name: Build
        run: pnpm build

      - name: Version bump and tag
        run: |
          git config --local user.email "${{ secrets.GH_EMAIL }}"
          git config --local user.name "${{ secrets.GH_USERNAME }}"
          pnpm version ${{ github.event.inputs.version_type }} --message "release: v%s"
          git push && git push --tags

          # Force-move the floating major tag (e.g. v1) to this release so consumers pinned at
          # `donfear/inup@v1` automatically pick up minor/patch fixes. A breaking change should be
          # released as the next major (v2), which starts its own floating tag and leaves v1 frozen.
          # publish.yml only triggers on `v*.*.*`, so re-pushing the floating tag won't re-publish.
          NEW_VERSION="v$(node -p "require('./package.json').version")"   # e.g. v1.6.3
          MAJOR="${NEW_VERSION%%.*}"                                       # e.g. v1
          git tag -f "$MAJOR" "$NEW_VERSION"
          git push -f origin "$MAJOR"

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "MAJOR=$MAJOR" >> "$GITHUB_ENV"

      - name: Create GitHub Release for this version
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --generate-notes

      - name: Update floating major release for Marketplace
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # The Marketplace listing is bound to whichever release published it — one-time manual
          # setup via the UI (Marketplace publishing can't be toggled through the API). Actions/
          # Marketplace resolve `donfear/inup@v1` via the *git tag* (already force-moved above),
          # not this release's target_commitish, so we only need to keep the notes current here.
          #
          # NB: `gh release edit --target` on this release reliably 500s (GitHub rejects
          # target_commitish changes on a Marketplace-bound release) — don't pass --target.
          if gh release view "$MAJOR" >/dev/null 2>&1; then
            gh release edit "$MAJOR" \
              --notes "Tracks the latest \`$MAJOR.x.y\` release for Marketplace users pinned to \`@$MAJOR\`. See [$NEW_VERSION]($(gh release view "$NEW_VERSION" --json url --jq .url)) for what's new."
          else
            echo "No existing '$MAJOR' release found — publish one manually once via the GitHub UI with 'Publish to Marketplace' checked, then this step will keep it in sync on future releases."
          fi

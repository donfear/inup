name: Record Demo

on:
  workflow_dispatch:

concurrency:
  group: record-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-demo:
    name: Record Demo
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install VHS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          VHS_VERSION="$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GH_PAT }}" https://api.github.com/repos/charmbracelet/vhs/releases/latest | jq -r '.tag_name')"
          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64) VHS_ARCH="x86_64" ;;
            arm64) VHS_ARCH="arm64" ;;
            armhf) VHS_ARCH="arm" ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          curl -fsSL "https://github.com/charmbracelet/vhs/releases/download/${VHS_VERSION}/vhs_${VHS_VERSION#v}_Linux_${VHS_ARCH}.tar.gz" -o /tmp/vhs.tar.gz
          mkdir -p /tmp/vhs-extract
          tar -xzf /tmp/vhs.tar.gz -C /tmp/vhs-extract
          VHS_BIN="$(find /tmp/vhs-extract -type f -name 'vhs' | head -1)"
          sudo install -m 0755 "$VHS_BIN" /usr/local/bin/vhs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record demo
        run: pnpm demo:record

      - name: Open pull request with demo GIF
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GIF_PATH: docs/demo/interactive-upgrade.gif
          MP4_PATH: docs/demo/interactive-upgrade.mp4
          PR_BRANCH: automated-demo-gif
        run: |
          set -euo pipefail

          if git diff --quiet -- "$GIF_PATH" "$MP4_PATH"; then
            echo "No demo recording changes to publish."
            exit 0
          fi

          git config user.email "${{ secrets.GH_EMAIL }}"
          git config user.name "${{ secrets.GH_USERNAME }}"

          # Preserve the freshly recorded GIF and the mp4 the website hero
          # plays (record-demo.sh emits both), then branch cleanly off main
          # so the pull request contains only the recording change
          # (regardless of which branch this workflow was dispatched from).
          cp "$GIF_PATH" "$RUNNER_TEMP/demo.gif"
          cp "$MP4_PATH" "$RUNNER_TEMP/demo.mp4"
          git fetch origin main
          git checkout -f -B "$PR_BRANCH" origin/main
          mkdir -p "$(dirname "$GIF_PATH")"
          cp "$RUNNER_TEMP/demo.gif" "$GIF_PATH"
          cp "$RUNNER_TEMP/demo.mp4" "$MP4_PATH"
          git add "$GIF_PATH" "$MP4_PATH"

          if git diff --cached --quiet; then
            echo "Recorded GIF is identical to the one on main; nothing to publish."
            exit 0
          fi

          git commit -m "docs: update demo recording (gif + mp4)"
          git push --force origin "$PR_BRANCH"

          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          {
            printf '%s\n\n' "Automated demo recording from \`${{ github.ref_name }}\` (run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            printf '%s\n\n' "Review the recording below before merging to \`main\`:"
            printf '%s\n\n' "![inup demo](https://raw.githubusercontent.com/${{ github.repository }}/${PR_BRANCH}/${GIF_PATH})"
            printf '%s\n' "_Generated by the Record Demo workflow._"
          } > "$BODY_FILE"

          if gh pr view "$PR_BRANCH" --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            PR_URL="$(gh pr view "$PR_BRANCH" --json url --jq '.url')"
            gh pr edit "$PR_BRANCH" --body-file "$BODY_FILE"
            echo "Updated existing PR: $PR_URL"
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "docs: update demo gif" \
              --body-file "$BODY_FILE")"
            echo "Opened PR: $PR_URL"
          fi

          echo "### Demo PR ready" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
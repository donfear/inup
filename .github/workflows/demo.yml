name: Record Demo

on:
  workflow_dispatch:

jobs:
  record-demo:
    name: Record Demo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install VHS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          VHS_VERSION="$(curl -fsSL https://api.github.com/repos/charmbracelet/vhs/releases/latest | jq -r '.tag_name')"
          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64) VHS_ARCH="x86_64" ;;
            arm64) VHS_ARCH="arm64" ;;
            armhf) VHS_ARCH="arm" ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          curl -fsSL "https://github.com/charmbracelet/vhs/releases/download/${VHS_VERSION}/vhs_${VHS_VERSION#v}_Linux_${VHS_ARCH}.tar.gz" -o /tmp/vhs.tar.gz
          tar -xzf /tmp/vhs.tar.gz -C /tmp
          sudo install -m 0755 /tmp/vhs /usr/local/bin/vhs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record demo
        run: pnpm demo:record

      - name: Commit and push demo GIF
        run: |
          if git diff --quiet -- docs/demo/interactive-upgrade.gif; then
            echo "No demo GIF changes to commit"
            exit 0
          fi

          git config --local user.email "${{ secrets.GH_EMAIL }}"
          git config --local user.name "${{ secrets.GH_USERNAME }}"
          git add docs/demo/interactive-upgrade.gif
          git commit -m "docs: update demo gif"
          git push

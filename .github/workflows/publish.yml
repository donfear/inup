name: Publish to npm

on:
  push:
    tags:
      # Match full version tags (v1.2.3) only — NOT the floating major tag (v1), which the
      # tag-major workflow force-moves on each release. Without this, moving v1 would re-trigger
      # a duplicate npm publish of the same version.
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      id-token: write     # npm provenance (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --provenance --no-git-checks

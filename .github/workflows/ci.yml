name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format and lint
        run: pnpm check:ci

      - name: Check architecture boundaries
        run: pnpm lint:deps

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Coverage output only exists after the run above, so the in-run badge
      # check is a no-op on a fresh checkout; re-run it now that numbers exist.
      - name: Check README test badges
        run: pnpm vitest run badges-readme

      - name: Build
        run: pnpm build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (new push to a PR) so stale jobs
# don't hog runners. Named workflow + ref keeps groups distinct across PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  # Fast, single-run static checks + a package-publish sanity gate. No tests here
  # so it fails quickly on lint/type/build errors independent of the OS matrix.
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format and lint
        run: pnpm check:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Validate the would-be published package (bin/main/files/exports resolve)
      # against the freshly built dist before it can ever reach npm.
      - name: Validate package (publint)
        run: pnpm dlx publint

  # Cross-OS / cross-Node test matrix. Coverage + the README badge check run on a
  # single canonical cell (ubuntu / Node 24); every other cell runs plain tests.
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 24 is the release toolchain — tested on every OS (paths/shell differ per platform).
        node: ['24']
        # Also exercise the engines floor (undici@8 requires Node >=22.19), but only once:
        # Node API availability is OS-independent, so a single Linux cell proves the floor
        # without re-running it on macOS/Windows.
        include:
          - os: ubuntu-latest
            node: '22.19.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Canonical cell: generate coverage (writes coverage/test-results.json) and
      # verify the README test/coverage badges are in sync with it.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          pnpm test:coverage
          pnpm vitest run badges-readme

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != '24'
        run: pnpm test

      # Smoke run of the offline benchmark: proves the harness still executes
      # and prints the numbers for the log. Not a gate — CI runners are too
      # noisy to assert on timings.
      - name: Benchmark (smoke)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: BENCH_RUNS=3 BENCH_FORMAT=table pnpm bench

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  # Rust checks plus the native core built and smoke-tested on all 8 platforms.
  native:
    name: Native
    uses: ./.github/workflows/native-build.yml

  # The real addon through inup's loader, against parseVersions/writeEtag and a
  # local HTTP server, on each OS family. INUP_PARITY_REQUIRED turns a missing
  # addon into a failure instead of a skip.
  native-parity:
    name: Native parity (${{ matrix.abi }})
    needs: native
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: linux-x64-gnu, host: ubuntu-latest }
          - { abi: darwin-arm64, host: macos-latest }
          - { abi: win32-x64-msvc, host: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.abi }}
          path: native/out
      - name: Parity tests
        env:
          INUP_PARITY_REQUIRED: '1'
        run: pnpm vitest run test/unit/shared/registry/rust-core.parity.test.ts test/unit/shared/registry/rust-transport.parity.test.ts

  # Assemble all 8 platform packages and pin their hashes into inup exactly as publish.yml
  # would, without publishing.
  native-packages:
    name: Native packages (dry run)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: native/artifacts
      - name: Assemble and dry-run publish
        run: node scripts/publish-native.mjs --artifacts native/artifacts --dry-run
      - name: Build with pinned native cores
        run: |
          pnpm build
          node scripts/publish-native.mjs --check-pins

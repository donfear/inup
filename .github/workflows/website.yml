name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      # The site renders content parsed from these at build time.
      - 'README.md'
      - 'action.yml'
  schedule:
    # Weekly rebuild so npm/GitHub stats and the changelog stay fresh.
    # Off-the-hour minute to dodge GitHub's cron congestion.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        uses: withastro/action@v6
        with:
          path: ./website
        env:
          # Authenticated GitHub API calls for stars/releases at build time.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

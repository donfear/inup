name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      # The site consumes these at build time: README marker sections,
      # package.json facts (version/description/keywords), the demo video.
      - 'README.md'
      - 'package.json'
      - 'docs/demo/**'
  # PRs run the build (typecheck + dist audits) without deploying — the
  # root CI workflow never touches the website, so this is its only gate.
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'README.md'
      - 'package.json'
      - 'docs/demo/**'
  schedule:
    # Weekly rebuild so npm/GitHub stats and the changelog stay fresh.
    # Off-the-hour minute to dodge GitHub's cron congestion.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue behind each other; PR check builds get their own group
# per PR so they never block (or get blocked by) a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('website-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        uses: withastro/action@v6
        with:
          path: ./website
        env:
          # Authenticated GitHub API calls for stars/releases at build time.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

[package]
name = "inup-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
brotlic = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
brotli = "8"
